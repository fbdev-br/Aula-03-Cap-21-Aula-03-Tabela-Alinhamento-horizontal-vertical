<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        td {
            border: 2px solid black;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 10px;
            padding-bottom: 8px;
        }
        
        .maior {
            height: 120px;
        }

        .esquerda {
            text-align: left;
        }
        
        .direita {
            text-align: right;
        }

        .centro {
            text-align: center;
        }

        .topo {
            vertical-align: top;
        }

        .baixo {
            vertical-align: bottom;
        }

        .largo1 {
            width: 90px;
        }

        .largo2 {
            width: 150px;
        }

    </style>
</head>

<body>
    <h1>Gabarito - Trabalhando com alinhamento</h1>
    <table>
        <tr>
            <td class="esquerda largo1">A1 <br>(esquerda)</td>
            <td class="centro largo2">B1 <br>(padrão centro)</td>
            <td class="direita largo1">C1 <br>(direita)</td>
        </tr>
        <tr class="maior">
            <td class="topo centro">A2 <br>(topo)</td>
            <td class="centro">B2 <br>(padrão)</td>
            <td class="baixo centro">C2 <br>(baixo)</td>
        </tr>
        <tr class="maior">
            <td class="topo centro">A3 <br>(topo)</td>
            <td class="baixo centro">B3 <br>(baixo)</td>
            <td class="centro">C3 <br>(padrão)</td>
        </tr>
        <tr>
            <td class="centro">A4</td>
            <td class="direita">1000 <br>(número a direita)</td>
            <td class="centro">C4</td>
        </tr>
    </table>
</body>

</html>
